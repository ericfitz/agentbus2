openapi: 3.1.0
info:
  title: agentbus2
  version: 2.0.0-dev
  description: >-
    The agentbus2 HTTP API (spec section 3, Decision 65). Path parameters: a
    client percent-encodes every path parameter exactly once (a space is %20,
    a percent sign %25, a slash inside a name %2F, a question mark %3F, a
    number sign %23); the server decodes each parameter exactly once, so a
    channel name such as 100% or a%2Fb round-trips as the literal name and an
    empty segment matches no route. Optional members are absent from the JSON,
    never null. Every error is application/problem+json.
security:
  - bearerAuth: []
tags:
  - name: discovery
  - name: health
  - name: sessions
  - name: channels
  - name: messages
  - name: memories
  - name: tasks
  - name: admin
  - name: auth
paths:
  /.well-known/agentbus2:
    get:
      operationId: wellKnown
      tags: [discovery]
      security: []
      responses:
        "200":
          description: Pointer to the versioned discovery endpoint (Decision 43).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellKnown"
        default:
          $ref: "#/components/responses/Problem"
  /.well-known/oauth-authorization-server:
    get:
      operationId: authorizationServerMetadata
      tags: [discovery]
      security: []
      responses:
        "200":
          description: >-
            OAuth 2.0 authorization server metadata (RFC 8414). The same
            document is served at /.well-known/openid-configuration for
            existing clients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationServerMetadata"
        default:
          $ref: "#/components/responses/Problem"
  /.well-known/openid-configuration:
    get:
      operationId: openidConfiguration
      tags: [discovery]
      security: []
      responses:
        "200":
          description: >-
            The same document as /.well-known/oauth-authorization-server. It
            is kept for existing clients. The server is not an OpenID Provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationServerMetadata"
        default:
          $ref: "#/components/responses/Problem"
  /v1/discover:
    get:
      operationId: discover
      tags: [discovery]
      security: []
      responses:
        "200":
          description: Server versions, capabilities and auth methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discovery"
        default:
          $ref: "#/components/responses/Problem"
  /v1/health:
    get:
      operationId: health
      tags: [health]
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: The health document, as the caller's tier may see it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /v1/sessions:
    post:
      operationId: openSession
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenSessionRequest"
      responses:
        "201":
          description: Session opened or resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
  /v1/sessions/{session}:
    delete:
      operationId: closeSession
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: Session closed.
        default:
          $ref: "#/components/responses/Problem"
  /v1/sessions/{session}/receive:
    post:
      operationId: receive
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveRequest"
      responses:
        "200":
          description: A batch of pending messages (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiveResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/sessions/{session}/watch:
    get:
      operationId: watch
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/SessionParam"
        - name: after
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 0
        - name: timeout
          in: query
          required: false
          description: Seconds to wait; fractional allowed; 0 or absent means the server cap.
          schema:
            type: number
            format: double
        - name: include_own
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Woke.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wake"
        "204":
          description: Timed out, nothing new.
        "409":
          description: Replaced by a newer watch on the same session.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/sessions/{session}/peek:
    get:
      operationId: peek
      tags: [sessions]
      description: Read-only pending counts above the watch floor. Writes nothing (no lease renewal, no cursor, no watch row, no receipt).
      parameters:
        - $ref: "#/components/parameters/SessionParam"
        - name: include_own
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The pending counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Peek"
        default:
          $ref: "#/components/responses/Problem"
  /v1/identities:
    get:
      operationId: listIdentities
      tags: [sessions]
      responses:
        "200":
          description: Registered identities and their open sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Identity"
        default:
          $ref: "#/components/responses/Problem"
  /v1/channels:
    get:
      operationId: listChannels
      tags: [channels]
      responses:
        "200":
          description: Channels visible to the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createChannel
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: Channel created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelInfo"
        default:
          $ref: "#/components/responses/Problem"
  /v1/channels/{channel}:
    delete:
      operationId: deleteChannel
      tags: [channels, admin]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: Channel deleted.
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: renameChannel
      tags: [channels, admin]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameChannelRequest"
      responses:
        "204":
          description: Channel renamed.
        default:
          $ref: "#/components/responses/Problem"
  /v1/channels/{channel}/acl:
    get:
      operationId: getACL
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
      responses:
        "200":
          description: The channel access control list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ACLEntry"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setACL
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ACLEntry"
      responses:
        "204":
          description: ACL replaced.
        default:
          $ref: "#/components/responses/Problem"
  /v1/channels/{channel}/subscription:
    put:
      operationId: subscribe
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "204":
          description: Subscribed.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unsubscribe
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: Unsubscribed.
        default:
          $ref: "#/components/responses/Problem"
  /v1/tag-subscriptions:
    get:
      operationId: listTagSubscriptions
      tags: [channels]
      responses:
        "200":
          description: The caller's tag subscriptions, each a set of patterns.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: string
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: subscribeTags
      tags: [channels]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagPatterns"
      responses:
        "204":
          description: Subscribed.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: unsubscribeTags
      tags: [channels]
      parameters:
        - name: pattern
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            items:
              type: string
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: Unsubscribed.
        default:
          $ref: "#/components/responses/Problem"
  /v1/channels/{channel}/messages:
    post:
      operationId: sendMessage
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendRequest"
      responses:
        "201":
          description: Message appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendResult"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: history
      tags: [messages]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - name: before
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: after
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: count
          in: query
          required: false
          schema:
            type: integer
        - name: thread
          in: query
          required: false
          description: Only the message with this sequence number and the messages whose reply_to is it.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: tags
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Messages of the channel.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        default:
          $ref: "#/components/responses/Problem"
  /v1/search:
    get:
      operationId: search
      tags: [messages]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [text, semantic, both]
        - name: channel
          in: query
          required: false
          schema:
            type: string
        - name: sender
          in: query
          required: false
          schema:
            type: string
        - name: since
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: until
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: thread
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: tags
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: count
          in: query
          required: false
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Search hits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/memories/{id}:
    get:
      operationId: getMemory
      tags: [memories]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: The current revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteMemory
      tags: [memories]
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: Memory deleted.
        default:
          $ref: "#/components/responses/Problem"
  /v1/memories/{id}/revisions:
    get:
      operationId: listMemoryRevisions
      tags: [memories]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Every revision, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: editMemory
      tags: [memories]
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditMemoryRequest"
      responses:
        "201":
          description: New revision appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/channels/{channel}/tasks:
    post:
      operationId: createTask
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "201":
          description: Task created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listTasks
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/ChannelParam"
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: owner
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Task summaries in tree order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskSummary"
        default:
          $ref: "#/components/responses/Problem"
  /v1/tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateTask
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          description: The updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskUpdateResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/tasks/{id}/claim:
    post:
      operationId: claimTask
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimTaskRequest"
      responses:
        "200":
          description: The claimed task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskUpdateResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/tasks/{id}/release:
    post:
      operationId: releaseTask
      tags: [tasks]
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "200":
          description: The released task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskUpdateResult"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/status:
    get:
      operationId: adminStatus
      tags: [admin]
      responses:
        "200":
          description: Server status for administrators.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/usage:
    get:
      operationId: adminUsage
      tags: [admin]
      description: >-
        The database size, the configured SQLite budget and the capacity
        notice (spec 3.2, Decision 48).
      responses:
        "200":
          description: Database usage for administrators.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/token:
    post:
      operationId: token
      tags: [auth]
      security: []
      description: >-
        RFC 7523 private_key_jwt client credentials grant (Decisions 19, 70):
        the client assertion's iss and sub are the identity and its aud is this
        server's issuer URL (the token endpoint URL is still accepted); and the
        RFC 8693 token exchange of a configured issuer's access token for a
        human bearer. Errors are RFC 6749 section 5.2 bodies.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: A short-lived bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthError"
        "500":
          $ref: "#/components/responses/OAuthError"
        "503":
          $ref: "#/components/responses/OAuthError"
  /v1/auth/jwks:
    get:
      operationId: jwks
      tags: [auth]
      security: []
      responses:
        "200":
          description: The public keys that verify tokens this server issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      security: []
      description: >-
        Registers an identity's public key (trust on first use, or with an
        enrollment token; Decisions 20, 58, 72).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The registration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/reset:
    post:
      operationId: adminReset
      tags: [admin]
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [data, everything]
            default: data
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "204":
          description: The server's data was reset.
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/identities/{identity}/reset-credential:
    post:
      operationId: resetCredential
      tags: [admin]
      parameters:
        - name: identity
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      responses:
        "200":
          description: The identity's registered keys were removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialReset"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/identities/by-email:
    post:
      operationId: createIdentityByEmail
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIdentityByEmailRequest"
      responses:
        "200":
          description: The human identity bound to the email, created when it did not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanIdentity"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/identities:
    post:
      operationId: createAgentIdentity
      tags: [admin]
      description: >-
        Creates an agent identity, optionally in an open scope, and a one-time
        enrollment token bound to its name (24 hours, one use). Administrator
        only. The token is never stored in clear and is not in an idempotency
        receipt, so the operation takes no idempotency key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentIdentityRequest"
      responses:
        "200":
          description: The identity and its enrollment token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentIdentity"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/scopes:
    post:
      operationId: createScope
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScopeRequest"
      responses:
        "200":
          description: The new open scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scope"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listScopes
      tags: [admin]
      responses:
        "200":
          description: The open and done scopes, without their members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScopeList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/scopes/{scope}:
    parameters:
      - $ref: "#/components/parameters/ScopeParam"
    get:
      operationId: getScope
      tags: [admin]
      responses:
        "200":
          description: The scope with its channel and identity names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scope"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/scopes/{scope}/done:
    post:
      operationId: doneScope
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ScopeParam"
        - $ref: "#/components/parameters/IdempotencyKeyParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoneScopeRequest"
      responses:
        "200":
          description: The scope, now done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scope"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/bridges:
    post:
      operationId: createBridge
      tags: [admin]
      description: >-
        Bridges a channel to a new private Slack channel. Forbidden with the
        text "the Slack bridge is not configured" when the server has no Slack
        bridge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBridgeRequest"
      responses:
        "200":
          description: The bridge and every human whom Slack could not invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeCreated"
        default:
          $ref: "#/components/responses/Problem"
    get:
      operationId: listBridges
      tags: [admin]
      responses:
        "200":
          description: Every bridge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BridgeList"
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/bridges/{channel}:
    parameters:
      - $ref: "#/components/parameters/ChannelParam"
    get:
      operationId: getBridge
      tags: [admin]
      responses:
        "200":
          description: The channel's bridge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bridge"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeBridge
      tags: [admin]
      responses:
        "204":
          description: The Slack channel is archived and the bridge is deleted.
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An access token (RFC 9068, typ at+jwt) issued by the authorization
        server described at /.well-known/oauth-authorization-server (RFC 8414).
  parameters:
    SessionParam:
      name: session
      in: path
      required: true
      schema:
        type: string
    ChannelParam:
      name: channel
      in: path
      required: true
      schema:
        type: string
    ScopeParam:
      name: scope
      in: path
      required: true
      schema:
        type: string
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: false
      description: Absent or empty means no receipt (Decision 66).
      schema:
        type: string
  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OAuthError:
      description: >-
        RFC 6749 section 5.2 error; only the token endpoint answers it (spec
        8.1).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
  schemas:
    # Convention: every JSON request-body schema (and each object inside a
    # request body) sets `additionalProperties: false`, so a misspelled or
    # unknown member is a 400 validation error instead of being silently
    # dropped. Two exceptions: TokenRequest, because an OAuth token endpoint
    # ignores parameters it does not know (RFC 6749 section 3.2); and JWK
    # (RegisterRequest.public_key_jwk), which is `additionalProperties: true`
    # because a key carries members that differ per key type (RFC 7517). A schema
    # used only in responses stays open so a newer server can add a member; a
    # schema shared by a request and a response (ACLEntry) follows the request
    # rule. A new request body follows the convention.
    Problem:
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: agentbus2 extension member (RFC 9457 section 3.2).
          enum:
            - validation
            - not_found
            - conflict
            - forbidden
            - not_registered
            - rate_limited
            - replaced
            - session_lapsed
            - session_closed
            - unavailable
            - internal
            - unauthenticated
        retryable:
          type: boolean
          description: agentbus2 extension member (RFC 9457 section 3.2).
    Wake:
      type: object
      required: [seq, count, channels]
      properties:
        seq:
          type: integer
          format: int64
        count:
          type: integer
        channels:
          type: array
          items:
            type: string
    Peek:
      type: object
      required: [count, channels]
      properties:
        count:
          type: integer
        channels:
          type: array
          items:
            type: object
            required: [channel, count]
            properties:
              channel:
                type: string
              count:
                type: integer
    WellKnown:
      type: object
      required: [discover]
      properties:
        discover:
          type: string
    AuthMethod:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        scheme:
          type: string
        bearer_format:
          type: string
    Discovery:
      type: object
      required: [api_versions, server_version, capabilities, auth_methods, issuers]
      properties:
        api_versions:
          type: array
          items:
            type: string
        server_version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        auth_methods:
          type: array
          items:
            $ref: "#/components/schemas/AuthMethod"
        authorization_server:
          type: string
          description: URL of the RFC 8414 authorization server metadata.
        openid_configuration:
          type: string
          description: >-
            URL of the same document under /.well-known/openid-configuration,
            kept for existing clients.
        issuers:
          type: array
          items:
            type: string
    AuthorizationServerMetadata:
      type: object
      required:
        - issuer
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - grant_types_supported
        - token_endpoint_auth_methods_supported
        - token_endpoint_auth_signing_alg_values_supported
      properties:
        issuer:
          type: string
        token_endpoint:
          type: string
        jwks_uri:
          type: string
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_signing_alg_values_supported:
          type: array
          items:
            type: string
    OfferedCursor:
      type: object
      additionalProperties: false
      required: [channel, seq]
      properties:
        channel:
          type: string
        seq:
          type: integer
          format: int64
    OpenSessionRequest:
      type: object
      additionalProperties: false
      properties:
        hint:
          type: string
        resume_token:
          type: string
        cursors:
          type: array
          items:
            $ref: "#/components/schemas/OfferedCursor"
    RejectedCursor:
      type: object
      required: [channel, reason]
      properties:
        channel:
          type: string
        reason:
          type: string
          enum: [before_retention, ahead, unreadable, unsubscribed]
    PendingChannel:
      type: object
      required: [channel, pending]
      properties:
        channel:
          type: string
        pending:
          type: integer
          format: int64
    Session:
      type: object
      required: [id, identity, display_name, resume_token, resumed, rejected_cursors, pending]
      properties:
        id:
          type: string
        identity:
          type: string
        display_name:
          type: string
        resume_token:
          type: string
        resumed:
          type: boolean
        rejected_cursors:
          type: array
          items:
            $ref: "#/components/schemas/RejectedCursor"
        pending:
          type: array
          items:
            $ref: "#/components/schemas/PendingChannel"
    ReceiveRequest:
      type: object
      additionalProperties: false
      properties:
        ack:
          type: string
        count:
          type: integer
        channels:
          type: array
          items:
            type: string
        include_own:
          type: boolean
    Gap:
      type: object
      required: [channel, from, to]
      properties:
        channel:
          type: string
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
    Message:
      type: object
      required: [seq, channel, sender, sender_kind, display, created_at, type, subject, content]
      properties:
        seq:
          type: integer
          format: int64
        channel:
          type: string
        sender:
          type: string
        sender_kind:
          type: string
          enum: [agent, human]
        session:
          type: string
        display:
          type: string
        created_at:
          type: integer
          format: int64
        type:
          type: string
        subject:
          type: string
        content:
          type: string
        reply_to:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties:
            type: string
        memory_id:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        tags:
          type: array
          items:
            type: string
        matched_tags:
          type: array
          items:
            type: string
    ReceiveResult:
      type: object
      required: [messages, batch, redelivered, ack_ignored, gaps]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        batch:
          type: string
        redelivered:
          type: boolean
        ack_ignored:
          type: boolean
        gaps:
          type: array
          items:
            $ref: "#/components/schemas/Gap"
        notice:
          type: string
        instruction:
          type: string
    SessionInfo:
      type: object
      required: [id, identity, display_name, opened_at]
      properties:
        id:
          type: string
        identity:
          type: string
        display_name:
          type: string
        opened_at:
          type: integer
          format: int64
    Identity:
      type: object
      required: [name, kind, admin, sessions]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [agent, human]
        admin:
