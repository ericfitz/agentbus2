# Builds the Linux and Windows release archives on runners of their own OS
# and architecture, runs each binary, attests build provenance, and uploads
# the archives to the draft release for the tag. Dispatched by
# release/release.sh on the tag itself (gh workflow run --ref <tag>), so the
# checked-out source and this file are the tag's. macOS is built locally.
# Windows binaries are Authenticode-signed in package-windows when dispatched
# with windows_signing=on (Microsoft Artifact Signing over OIDC; no stored
# secret).
name: release-build
run-name: release-build ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z); dispatch on that tag with --ref
        required: true
        type: string
      windows_signing:
        description: Authenticode-sign the Windows binaries (on) or not (off)
        required: true
        type: choice
        options: ['on', 'off'] # quoted: bare on/off are YAML 1.1 booleans
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true
      - id: check
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          WINDOWS_SIGNING: ${{ inputs.windows_signing }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$TAG' must be a stable release tag like v1.2.3 (prereleases are not supported)"; exit 1; }
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::tag $TAG not found in the repository"; exit 1; }
          [[ "$GITHUB_REF_NAME" == "$TAG" ]] || { echo "::error::dispatched on '$GITHUB_REF_NAME', not on tag $TAG; use: gh workflow run release-build.yml --ref $TAG -f tag=$TAG"; exit 1; }
          case "$WINDOWS_SIGNING" in on|off) ;; *) echo "::error::windows_signing must be on or off, got '$WINDOWS_SIGNING'"; exit 1 ;; esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { runner: windows-latest, goos: windows, goarch: amd64 }
          - { runner: windows-11-arm, goos: windows, goarch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - id: build
        name: Build and run
        shell: bash
        run: |
          set -euo pipefail
          bash release/build-archive.sh "$TAG" "$GOOS" "$GOARCH" out
      - id: upload
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/agentbus2-${{ inputs.tag }}-linux-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error
      - id: upload-exe
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exe-windows-${{ matrix.goarch }}
          path: out/agentbus2.exe
          if-no-files-found: error
  package-windows:
    needs: [validate, build]
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.validate.outputs.version }}
      WINDOWS_SIGNING: ${{ inputs.windows_signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: release/windows-zip-README.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: download-exe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: exe-windows-*
          path: exe
      - id: check-vars
        if: inputs.windows_signing == 'on'
        name: Require the signing variables
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AUTHENTICODE_SIGNER: ${{ vars.AUTHENTICODE_SIGNER }}
        run: |
          $names = 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'ARTIFACT_SIGNING_ENDPOINT', 'ARTIFACT_SIGNING_ACCOUNT', 'ARTIFACT_SIGNING_PROFILE', 'AUTHENTICODE_SIGNER'
          $missing = @($names | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) { Write-Host "::error::missing repository variables: $($missing -join ', ') (docs/release-signing.md, step 4)"; exit 1 }
      - id: login
        if: inputs.windows_signing == 'on'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: sign
        if: inputs.windows_signing == 'on'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\exe
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          # Only the Azure CLI credential from the login step above is tried.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - id: verify-signature
        if: inputs.windows_signing == 'on'
        name: Verify Authenticode
        shell: pwsh
        env:
          AUTHENTICODE_SIGNER: ${{ vars.AUTHENTICODE_SIGNER }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in 'exe\exe-windows-amd64\agentbus2.exe', 'exe\exe-windows-arm64\agentbus2.exe') {
            $s = Get-AuthenticodeSignature -FilePath $f
            if ($s.Status -ne 'Valid') { Write-Host "::error::$f signature status is $($s.Status) ($($s.StatusMessage))"; exit 1 }
            $cn = $s.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($cn -ne $env:AUTHENTICODE_SIGNER) { Write-Host "::error::$f signer CN is '$cn', want AUTHENTICODE_SIGNER='$env:AUTHENTICODE_SIGNER' (the certificate's common name, not the full subject)"; exit 1 }
            if (-not $s.TimeStamperCertificate) { Write-Host "::error::$f has no timestamp countersignature; the signature would expire with the certificate"; exit 1 }
            Write-Host "$f signed by $cn, timestamped by $($s.TimeStamperCertificate.Subject)"
          }
          $v = (& .\exe\exe-windows-amd64\agentbus2.exe version | Select-Object -First 1)
          if ($v -ne $env:VERSION) { Write-Host "::error::signed agentbus2 version printed '$v', want $env:VERSION"; exit 1 }
      - id: package
        shell: pwsh
        run: |
          Copy-Item -LiteralPath release\windows-zip-README.txt -Destination README.txt
          Compress-Archive -LiteralPath exe\exe-windows-amd64\agentbus2.exe, README.txt -DestinationPath "agentbus2-$env:TAG-windows-amd64.zip"
          Compress-Archive -LiteralPath exe\exe-windows-arm64\agentbus2.exe, README.txt -DestinationPath "agentbus2-$env:TAG-windows-arm64.zip"
      - id: upload-amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-windows-amd64
          path: agentbus2-${{ inputs.tag }}-windows-amd64.zip
          if-no-files-found: error
      - id: upload-arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-windows-arm64
          path: agentbus2-${{ inputs.tag }}-windows-arm64.zip
          if-no-files-found: error
  publish:
    needs: [validate, build, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          merge-multiple: true
          path: archives
      - name: Require all four archives
        shell: bash
        run: |
          set -euo pipefail
          ls -l archives
          for a in linux-amd64.tar.gz linux-arm64.tar.gz windows-amd64.zip windows-arm64.zip; do
            [[ -f "archives/agentbus2-$TAG-$a" ]] || { echo "::error::missing archives/agentbus2-$TAG-$a"; exit 1; }
          done
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: archives/*
      - id: upload-release
        name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" archives/* --clobber --repo "$GITHUB_REPOSITORY"
