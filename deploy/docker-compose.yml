# Two agentmesh replicas over one Postgres. Copy example.env to .env first (docker compose reads deploy/.env).
services:
  postgres:
    image: cgr.dev/chainguard/postgres:latest@sha256:0926ac7262a2c1963179eb939cd5d610e1be3ecca90b4b5cad8db8df16fab87e # Postgres 18; its LANG is en_US.UTF-8, so the initdb locale is UTF-8, which the server's Open requires
    environment:
      POSTGRES_DB: agentmesh
      POSTGRES_USER: agentmesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmesh -d agentmesh"]
      interval: 2s
      timeout: 3s
      retries: 30

  agentmesh-a: &agentmesh
    image: agentmesh:local
    build:
      context: ..
    environment:
      AGENTMESH_SERVER_LISTEN: 0.0.0.0:8420
      AGENTMESH_SERVER_POSTGRES: postgres://agentmesh:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/agentmesh?sslmode=disable
      AGENTMESH_SERVER_ISSUER: ${AGENTMESH_ISSUER:-http://localhost:8420}
    command: ["-registration", "enrollment"]
    ports:
      - "127.0.0.1:8420:8420"
    depends_on:
      postgres:
        condition: service_healthy

  # Both replicas read the signing key row from the database: no keys volume.
  agentmesh-b:
    <<: *agentmesh
    ports:
      - "127.0.0.1:8421:8420"

volumes:
  pgdata:
