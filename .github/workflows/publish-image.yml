# Builds the container image for a release tag and pushes it to ghcr.io.
# Gated off: the job does nothing unless the repository variable
# IMAGE_REPOSITORY is set (its value: docs/release.md). It is
# ghcr-only by construction (it logs in with GITHUB_TOKEN); another registry
# needs its own credential secret and an explicit decision. Publishing a
# release fires it: release.sh's `gh release edit --draft=false` (run with the
# maintainer's token, not GITHUB_TOKEN) sends `release: published`. The
# --no-publish dry run never undrafts, so it never triggers this workflow;
# with IMAGE_REPOSITORY unset the job is skipped either way.
name: publish-image
run-name: publish-image ${{ github.event.release.tag_name || inputs.tag }}
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z) to build the image from
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ vars.IMAGE_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
    steps:
      - id: tag
        name: Resolve the tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$tag' must be a stable release tag like v1.2.3"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - id: registry
        name: Require a ghcr.io repository
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_REPOSITORY" == ghcr.io/* ]] || { echo "::error::IMAGE_REPOSITORY must be under ghcr.io, got '$IMAGE_REPOSITORY'"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - id: dockerfile
        name: Require the Dockerfile in the tag
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          [[ -f Dockerfile ]] || { echo "::error::Dockerfile is not in tag $TAG"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build and check the image
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          docker build --build-arg "VERSION=$VERSION" -t "$IMAGE_REPOSITORY:$VERSION" .
          test "$(docker run --rm --entrypoint /agentbus2 "$IMAGE_REPOSITORY:$VERSION" version)" = "$VERSION"
      - id: push
        name: Tag latest and push
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          docker tag "$IMAGE_REPOSITORY:$VERSION" "$IMAGE_REPOSITORY:latest"
          docker push "$IMAGE_REPOSITORY:$VERSION"
          docker push "$IMAGE_REPOSITORY:latest"
