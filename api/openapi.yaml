          type: boolean
    ClaimTaskRequest:
      type: object
      additionalProperties: false
      properties:
        leased_until:
          type: integer
          format: int64
    Notice:
      type: object
      required: [kind, message, set_at]
      properties:
        kind:
          type: string
        message:
          type: string
        set_at:
          type: integer
          format: int64
    Status:
      type: object
      required: [sessions, channels, notices, embedding_backlog, embedding_rejected]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelInfo"
        notices:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
        embedding_backlog:
          type: integer
        embedding_rejected:
          type: integer
        embedding_rejected_last:
          type: string
        embedding_error:
          type: string
        embedding_error_at:
          type: integer
          format: int64
    Usage:
      type: object
      required: [bytes, budget_bytes, evictable]
      properties:
        bytes:
          type: integer
          format: int64
        budget_bytes:
          type: integer
          format: int64
        evictable:
          type: boolean
        notice:
          type: string
          description: The capacity notice text, when one is set.
    Health:
      type: object
      description: >-
        The server's health as the caller's tier may see it (spec
        2026-10-25 section 4). Members above the probe tier are absent, never
        null, below their tier. An unreachable store is a 503 problem with
        code unavailable, never a document.
      required: [status, tier, version, now]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        tier:
          type: string
          enum: [probe, identity, admin]
        version:
          type: string
        now:
          type: integer
          format: int64
        started_at:
          type: integer
          format: int64
        store:
          $ref: "#/components/schemas/HealthStore"
        embeddings:
          $ref: "#/components/schemas/HealthEmbeddings"
        storage:
          $ref: "#/components/schemas/Usage"
        notices:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
        maintenance:
          $ref: "#/components/schemas/HealthMaintenance"
    HealthStore:
      type: object
      required: [engine, schema_version]
      properties:
        engine:
          type: string
          enum: [sqlite, postgres]
        schema_version:
          type: integer
    HealthEmbeddings:
      type: object
      required: [state, backlog, rejected]
      properties:
        state:
          type: string
          enum: [off, ok, failing]
        backlog:
          type: integer
          description: >-
            Memories waiting for an embedding, capped at 1000 (the search page
            maximum), so 1000 means "at least 1000".
        rejected:
          type: integer
        model:
          type: string
        last_error:
          type: string
        last_error_at:
          type: integer
          format: int64
        rejected_last:
          type: string
    HealthMaintenance:
      type: object
      required: [interval_seconds, owner, lock, jobs]
      properties:
        interval_seconds:
          type: integer
        owner:
          type: string
        lock:
          type: string
          enum: [held, held_elsewhere, unknown]
        last_tick_at:
          type: integer
          format: int64
        lock_error:
          type: string
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/HealthJob"
    HealthJob:
      type: object
      required: [name, changed, skipped]
      properties:
        name:
          type: string
        changed:
          type: integer
        error:
          type: string
        skipped:
          type: boolean
    TokenRequest:
      type: object
      description: >-
        RFC 6749 section 4.4.2 and RFC 8693 section 2.1 token request. The
        grant is a plain string so that an unsupported one answers
        unsupported_grant_type (RFC 6749 section 5.2) rather than failing
        validation; the handler checks which parameters each grant needs.
      required: [grant_type]
      properties:
        grant_type:
          type: string
        client_assertion_type:
          type: string
        client_assertion:
          type: string
        client_id:
          type: string
        scope:
          type: string
        subject_token:
          type: string
        subject_token_type:
          type: string
        requested_token_type:
          type: string
        audience:
          type: string
        resource:
          type: string
        actor_token:
          type: string
        actor_token_type:
          type: string
    OAuthError:
      type: object
      description: RFC 6749 section 5.2 error body.
      required: [error]
      properties:
        error:
          type: string
        error_description:
          type: string
    AccessToken:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          format: int64
        issued_token_type:
          type: string
    JWK:
      type: object
      additionalProperties: true
    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/JWK"
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [identity, public_key_jwk]
      properties:
        identity:
          type: string
        public_key_jwk:
          $ref: "#/components/schemas/JWK"
        enrollment_token:
          type: string
    Registration:
      type: object
      required: [identity, kid, algorithm, created]
      properties:
        identity:
          type: string
        kid:
          type: string
        algorithm:
          type: string
          enum: [EdDSA, ES256]
        created:
          type: boolean
    CreateIdentityByEmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
    HumanIdentity:
      type: object
      required: [identity, created]
      properties:
        identity:
          type: string
        created:
          type: boolean
    CredentialReset:
      type: object
      required: [identity, keys_removed]
      properties:
        identity:
          type: string
        keys_removed:
          type: integer
    CreateAgentIdentityRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        scope:
          type: string
    AgentIdentity:
      type: object
      required: [identity, created, enrollment_token, expires_at]
      properties:
        identity:
          type: string
        scope:
          type: string
        created:
          type: boolean
        enrollment_token:
          type: string
        expires_at:
          type: integer
          format: int64
    CreateScopeRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
    DoneScopeRequest:
      type: object
      additionalProperties: false
      required: [retire]
      properties:
        retire:
          type: string
          enum: [with_bridge, normal]
    Scope:
      type: object
      required: [name, state, created_at, last_activity]
      properties:
        name:
          type: string
        state:
          type: string
          enum: [open, done, retired]
        retire:
          type: string
          enum: [with_bridge, normal]
        created_at:
          type: integer
          format: int64
        done_at:
          type: integer
          format: int64
        last_activity:
          type: integer
          format: int64
        channels:
          type: array
          items:
            type: string
        identities:
          type: array
          items:
            type: string
    ScopeList:
      type: object
      required: [scopes]
      properties:
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
    CreateBridgeRequest:
      type: object
      additionalProperties: false
      required: [channel]
      properties:
        channel:
          type: string
        slack_name:
          type: string
    Bridge:
      type: object
      required: [channel, scope, slack_name, state, created_at]
      properties:
        channel:
          type: string
        scope:
          type: string
        slack_channel_id:
          type: string
        slack_name:
          type: string
        state:
          type: string
          enum: [creating, live, archived]
        created_at:
          type: integer
          format: int64
        archived_at:
          type: integer
          format: int64
    BridgeNotInvited:
      type: object
      required: [identity, reason]
      properties:
        identity:
          type: string
        reason:
          type: string
    BridgeCreated:
      type: object
      required: [bridge, not_invited]
      properties:
        bridge:
          $ref: "#/components/schemas/Bridge"
        not_invited:
          type: array
          items:
            $ref: "#/components/schemas/BridgeNotInvited"
    BridgeList:
      type: object
      required: [bridges]
      properties:
        bridges:
          type: array
          items:
            $ref: "#/components/schemas/Bridge"
