            $ref: "#/components/schemas/SessionInfo"
    Channel:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [ordinary, memory, tasks]
    ChannelInfo:
      type: object
      required: [name, kind, creator, created_at]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [ordinary, memory, tasks]
        creator:
          type: string
        scope:
          type: string
        created_at:
          type: integer
          format: int64
    ACLEntry:
      type: object
      additionalProperties: false
      required: [identity, permissions]
      properties:
        identity:
          type: string
        permissions:
          type: array
          items:
            type: string
            enum: [read, write, admin]
    CreateChannelRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [ordinary, memory, tasks]
        acl:
          type: array
          items:
            $ref: "#/components/schemas/ACLEntry"
        scope:
          type: string
    RenameChannelRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
    SubscribeRequest:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
          enum: [now, oldest]
    TagPatterns:
      type: object
      additionalProperties: false
      required: [patterns]
      properties:
        patterns:
          type: array
          items:
            type: string
    SendRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        subject:
          type: string
        content:
          type: string
        type:
          type: string
        reply_to:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
        session:
          type: string
    SendResult:
      type: object
      required: [seq]
      properties:
        seq:
          type: integer
          format: int64
        memory_id:
          type: integer
          format: int64
    SearchHit:
      type: object
      required: [message, score]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        score:
          type: number
          format: double
    SearchResult:
      type: object
      required: [hits]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        next:
          type: string
        semantic_unavailable:
          type: boolean
    EditMemoryRequest:
      type: object
      description: >-
        Every field is optional and an omitted field keeps the live revision's
        value; a present empty subject, type, metadata or tags clears it.
        Content cannot be cleared (an empty content is a validation error).
        A request with no field is a validation error.
      additionalProperties: false
      properties:
        if_revision:
          type: integer
          format: int64
          minimum: 1
          description: The revision the caller read; the edit fails with conflict if the live revision differs.
        subject:
          type: string
        content:
          type: string
        type:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
    EditResult:
      type: object
      required: [seq, memory_id, revision, replaced]
      properties:
        seq:
          type: integer
          format: int64
        memory_id:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
        replaced:
          type: integer
          format: int64
    Task:
      type: object
      required: [id, channel, revision, subject, status, rank, blocked, updated_at, updated_by]
      properties:
        id:
          type: integer
          format: int64
        channel:
          type: string
        revision:
          type: integer
          format: int64
        subject:
          type: string
        description:
          type: string
        status:
          type: string
        owner:
          type: string
        parent:
          type: integer
          format: int64
        rank:
          type: string
        blocked_by:
          type: array
          items:
            type: integer
            format: int64
        leased_until:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties:
            type: string
        blocked:
          type: boolean
        open_blockers:
          type: array
          items:
            type: integer
            format: int64
        updated_at:
          type: integer
          format: int64
        updated_by:
          type: string
    TaskSummary:
      type: object
      required: [id, subject, status, depth]
      properties:
        id:
          type: integer
          format: int64
        subject:
          type: string
        status:
          type: string
        owner:
          type: string
        parent:
          type: integer
          format: int64
        depth:
          type: integer
        open_blockers:
          type: array
          items:
            type: integer
            format: int64
        leased_until:
          type: integer
          format: int64
        has_details:
          type: boolean
    TaskCreateRequest:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          type: string
        description:
          type: string
        parent:
          type: integer
          format: int64
        before:
          type: integer
          format: int64
        after:
          type: integer
          format: int64
        blocked_by:
          type: array
          items:
            type: integer
            format: int64
        metadata:
          type: object
          additionalProperties:
            type: string
    TaskPatch:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
        owner:
          type: string
        subject:
          type: string
        description:
          type: string
        parent:
          type: integer
          format: int64
        before:
          type: integer
          format: int64
        after:
          type: integer
          format: int64
        add_blocked_by:
          type: array
          items:
            type: integer
            format: int64
        remove_blocked_by:
          type: array
          items:
            type: integer
            format: int64
        leased_until:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties:
            type: string
        delete:
          type: boolean
        force:
          type: boolean
    TaskUpdateResult:
      type: object
      required: [task, replaced]
      properties:
        task:
          $ref: "#/components/schemas/Task"
